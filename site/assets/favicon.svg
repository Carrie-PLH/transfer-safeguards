<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Room &amp; Recourse</title>
  <desc id="desc">An open door on a dark ground.</desc>
  <!-- The door glyph from assets/roomandrecourse-wordmark.svg, alone, on the
       site ground #171013. Drawn in the wordmark's source coordinates and scaled
       into the 64px box; the stroke is widened from 9.5 to 20 in those source
       units (3.4px here) so the glyph survives a 16px rendering.
       tools/make-icons.py redraws this same geometry for the PNG and ICO icons. -->
  <rect width="64" height="64" fill="#171013"/>
  <g transform="translate(-2.08 -45.47) scale(0.17082)"
     fill="none" stroke="#e0aab5" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M184.5 313V594"/>
    <path d="M184.5 349.5H117.5V565"/>
    <path d="M184.5 315L281 349V559L184.5 593"/>
    <circle cx="252" cy="456" r="14" fill="#e0aab5" stroke="none"/>
  </g>
</svg>
